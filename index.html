const T=THREE,$=s=>document.querySelector(s),app=$('#app'),M=Math,rnd=M.random,PI=M.PI,cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

{const f=cvs(96,128),g=f.getContext('2d'),q=g.createLinearGradient(0,0,0,128);q.addColorStop(0,'#f6c28e');q.addColorStop(1,'#fbe7c2');g.fillStyle=q;g.fillRect(0,0,96,128);g.fillStyle='#fff6d6';g.beginPath();g.arc(60,52,14,0,7);g.fill();g.fillStyle='#7a8f6a';g.beginPath();g.moveTo(0,96);g.quadraticCurveTo(40,60,96,92);g.lineTo(96,128);g.lineTo(0,128);g.fill();g.fillStyle='#4a5a45';g.beginPath();g.arc(30,100,6,0,7);g.arc(40,98,6,0,7);g.fill();
